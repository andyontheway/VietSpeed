name: VietSpeed
options:
  bundleIdPrefix: com.jr
  deploymentTarget:
    iOS: "17.0"
targets:
  VietSpeed:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VietSpeed
    dependencies:
      - target: VietSpeedWidget
    settings:
      base:
        PRODUCT_NAME: VietSpeed
        PRODUCT_BUNDLE_IDENTIFIER: com.jr.VietSpeed
        INFOPLIST_FILE: VietSpeed/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  VietSpeedWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VietSpeedWidget
    settings:
      base:
        PRODUCT_NAME: VietSpeedWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.jr.VietSpeed.Widget
        INFOPLIST_FILE: VietSpeedWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
